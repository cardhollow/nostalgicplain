<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nostalgic Plain</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0e12}
body{font-family:monospace}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{
 position:fixed;left:12px;top:12px;z-index:20;
 padding:8px 12px;border-radius:9px;
 background:rgba(20,16,10,.55);display:none;
 border:1px solid rgba(255,243,198,.24);
 color:#fff1bd;font:12px/1.45 monospace;
 text-shadow:0 2px 3px rgba(0,0,0,.75);
 pointer-events:none;
 backdrop-filter:blur(4px);
}
#cross{
 position:fixed;left:50%;top:50%;z-index:21;display:none;
 width:5px;height:5px;margin:-2.5px;border-radius:50%;
 background:rgba(255,243,198,.55);pointer-events:none
}
#jump{
 display:none;position:fixed;right:18px;bottom:18px;z-index:30;
 width:80px;height:80px;border-radius:50%;
 border:1px solid rgba(255,240,185,.35);
 background:rgba(45,35,12,.38);
 color:#fff0bd;font:bold 13px monospace
}
@media (max-width: 768px) {#jump {display: block;}}
#fade{
 position:fixed;inset:0;z-index:10;pointer-events:none;
 background:radial-gradient(ellipse at center,transparent 46%,rgba(5,3,1,.25) 100%);
 background-color:transparent;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">CLICK ANYWHERE TO AWAKEN WORLD & SOUNDSCAPE...</div>
<div id="cross"></div>
<button id="jump">JUMP</button>
<div id="fade"></div>

<script>
"use strict";

const canvas=document.getElementById("c");
const hud=document.getElementById("hud");

const gl=canvas.getContext("webgl2",{
 antialias:false,
 alpha:false,
 depth:true,
 stencil:false,
 powerPreference:"high-performance"
});

if(!gl){
 hud.textContent="WEBGL2 IS NOT AVAILABLE";
 throw new Error("WebGL2 unavailable");
}

function compile(type,src){
 const s=gl.createShader(type);
 gl.shaderSource(s,src);
 gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
  const msg=gl.getShaderInfoLog(s)||"shader compile error";
  console.error(msg);
  throw new Error(msg);
 }
 return s;
}

function makeProgram(vs,fs){
 const p=gl.createProgram();
 gl.attachShader(p,compile(gl.VERTEX_SHADER,vs));
 gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
 gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS)){
  throw new Error(gl.getProgramInfoLog(p)||"program link error");
 }
 return p;
}

const skyProgram=makeProgram(
`#version 300 es
precision highp float;
layout(location=0) in vec2 aPos;
out vec2 vUv;

void main(){
 vUv=aPos;
 gl_Position=vec4(aPos,1.,1.);
}`,
`#version 300 es
precision highp float;
in vec2 vUv;

uniform mat4 uView;
uniform mat4 uProj;
uniform float uTime;
uniform float uRain;

uniform vec3 uSkyTop;
uniform vec3 uSkyHorizon;
uniform vec3 uSunDir;
uniform vec3 uSunColor;
uniform vec3 uMoonDir;
uniform vec3 uMoonColor;
uniform vec3 uCloudColor;
uniform float uNightFactor;

out vec4 outColor;

float hash(vec2 p){
 return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);
}

float noise(vec2 p){
 vec2 i=floor(p),f=fract(p);
 vec2 u=f*f*(3.-2.*f);
 return mix(
  mix(hash(i+vec2(0.,0.)),hash(i+vec2(1.,0.)),u.x),
  mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),
  u.y
 );
}

float fbm(vec2 p){
 float f=0.;
 f+=.5000*noise(p);p*=2.02;
 f+=.2500*noise(p);p*=2.03;
 f+=.1250*noise(p);p*=2.01;
 f+=.0625*noise(p);
 return f/.9375;
}

float hash3(vec3 p){
 p=fract(p*vec3(443.8975,397.2973,491.1871));
 p+=dot(p,p.yxz+19.19);
 return fract((p.x+p.y)*p.z);
}

void main(){
 vec4 target=inverse(uProj)*vec4(vUv,1.0,1.0);
 vec3 viewDir=target.xyz/target.w;
 vec3 worldDir=(inverse(uView)*vec4(viewDir,0.0)).xyz;
 vec3 rd=normalize(worldDir);

 vec3 horizonCol=mix(uSkyHorizon,vec3(0.18,0.20,0.24),uRain*.75);
 vec3 topCol=mix(uSkyTop,vec3(0.08,0.10,0.12),uRain*.75);

 float g=pow(1.0-max(rd.y,0.0),2.2);
 vec3 c=mix(topCol,horizonCol,g);

 if(uNightFactor>0.02&&rd.y>0.0){
  vec3 starCoord=floor(rd*280.0);
  float h=hash3(starCoord);

  if(h>0.978){
   float speed1=.7+hash3(starCoord+17.31)*2.8;
   float speed2=1.5+hash3(starCoord+43.72)*5.0;
   float phase1=hash3(starCoord+81.14)*6.2831;
   float phase2=hash3(starCoord+126.57)*6.2831;

   float w1=sin(uTime*speed1+phase1);
   float w2=sin(uTime*speed2+phase2);
   float w3=sin(uTime*(0.25+hash3(starCoord+211.8)*1.2));

   float twinkle=.5+.5*(w1*.55+w2*.30+w3*.15);
   twinkle=smoothstep(.05,.95,twinkle);

   float starIntensity=
    pow((h-.978)/.022,2.0)*
    (.18+.82*twinkle);

   float fade=
    smoothstep(0.0,.25,rd.y)*
    uNightFactor*
    (1.0-uRain*.9);

   c+=vec3(.85,.92,1.0)*
      starIntensity*
      fade*
      1.8;
  }

  float mTime=uTime*.40;
  float mCycle=floor(mTime);
  float mProgress=fract(mTime);
  float mHash=hash(vec2(mCycle,91.17));

  if(mHash>.35&&mProgress<.35){
   float normP=mProgress/.35;
   vec2 mStart=vec2(
    hash(vec2(mCycle,1.3))*3.0-1.5,
    hash(vec2(mCycle,2.4))*.4+.35
   );

   vec2 mDir=normalize(vec2(
    hash(vec2(mCycle,3.5))-.5,
    -abs(hash(vec2(mCycle,4.6)))-.3
   ));

   float mLen=.38;

   vec2 skyProj=rd.xz/(rd.y+.25);
   vec2 headPos=mStart+mDir*(normP*2.4);
   vec2 tailPos=headPos-mDir*mLen;

   vec2 pa=skyProj-tailPos;
   vec2 ba=headPos-tailPos;

   float hSeg=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);
   float dist=length(pa-ba*hSeg);

   if(dist<.016){
    float trail=hSeg*(1.0-dist/.016);
    float meteorFade=
     sin(normP*3.14159)*
     uNightFactor*
     (1.0-uRain);

    c+=vec3(.9,.95,1.0)*
       trail*
       meteorFade*
       4.0;
   }
  }
 }

 float sunDot=max(dot(rd,uSunDir),0.0);
 float sunDisk=pow(sunDot,1024.0)*(1.0-uRain*.95);
 float sunHalo=pow(sunDot,24.0)*.45*(1.0-uRain*.8);
 float sunScatter=pow(sunDot,6.0)*.15*(1.0-uRain*.7);

 c+=uSunColor*sunDisk*2.8;
 c+=uSunColor*sunHalo;
 c+=mix(uSunColor,uSkyHorizon,.5)*sunScatter;

 float moonDot=max(dot(rd,uMoonDir),0.0);
 float moonDisk=pow(moonDot,1200.0)*uNightFactor*(1.0-uRain*.95);
 float moonHalo=pow(moonDot,32.0)*.22*uNightFactor*(1.0-uRain*.85);

 c+=uMoonColor*moonDisk*2.2;
 c+=uMoonColor*moonHalo;

 if(rd.y>0.0){
  float t=1.8/rd.y;
  vec2 p=rd.xz*t*.16;
  p+=uTime*(.012+uRain*.05);

  float cl=fbm(p);
  cl=smoothstep(.30-uRain*.20,.76-uRain*.25,cl);
  float cloudFade=smoothstep(0.0,.18,rd.y);

  vec3 baseCloud=mix(
   uCloudColor,
   vec3(.25,.28,.32),
   uRain
  );

  float sunCloudLight=
   pow(max(dot(rd,uSunDir),0.0),4.0)*.45;

  float moonCloudLight=
   pow(max(dot(rd,uMoonDir),0.0),4.0)*
   .30*
   uNightFactor;

  vec3 finalCloudCol=
   baseCloud+
   uSunColor*sunCloudLight+
   uMoonColor*moonCloudLight;

  c=mix(
   c,
   finalCloudCol,
   cl*cloudFade*(.75+uRain*.25)
  );
 }

 outColor=vec4(c,1.0);
}`
);

const terrainProgram=makeProgram(
`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in float aShade;

uniform mat4 uView;
uniform mat4 uProj;

out float shade;
out float heightValue;
out float vDist;

void main(){
 shade=aShade;
 heightValue=aPos.y;

 vec4 viewPos=uView*vec4(aPos,1.);
 vDist=length(viewPos.xyz);

 gl_Position=uProj*viewPos;
}`,
`#version 300 es
precision mediump float;

in float shade;
in float heightValue;
in float vDist;

uniform vec3 uFogColor;
uniform vec3 uAmbientColor;
uniform vec3 uSunColor;
uniform vec3 uSunDir;

out vec4 outColor;

void main(){
 vec3 low=vec3(.20,.32,.08);
 vec3 high=vec3(.38,.48,.15);

 float h=clamp(heightValue*.08,0.,1.);
 vec3 baseColor=mix(low,high,h);

 float lightIntensity=
  shade*
  (.55+.45*max(0.0,uSunDir.y));

 vec3 c=
  baseColor*
  (uAmbientColor+uSunColor*lightIntensity);

 float fog=smoothstep(35.0,110.0,vDist);
 c=mix(c,uFogColor,fog);

 outColor=vec4(c,1.);
}`
);

const grassVerts=[];

function addBlade(angle,w,h,lean,x,z){
 const c=Math.cos(angle),s=Math.sin(angle);
 const sx=-s*w,sz=c*w;

 grassVerts.push(
  x-sx,0,z-sz,
  x+sx,0,z+sz,
  x+lean*c,h,z+lean*s
 );
}

addBlade(.15,.075,.72,.07,0,0);
addBlade(1.05,.070,.58,-.05,.05,-.02);
addBlade(1.98,.064,.48,.05,-.045,.035);
addBlade(2.80,.072,.66,-.07,.035,.055);
addBlade(3.66,.056,.42,.04,-.055,-.045);
addBlade(4.35,.068,.61,.06,.06,.02);
addBlade(5.35,.060,.50,-.04,-.02,-.065);

const grassProgram=makeProgram(
`#version 300 es
precision highp float;

layout(location=0) in vec3 aBlade;
layout(location=1) in vec4 iTransform;
layout(location=2) in vec3 iVar;

uniform mat4 uView;
uniform mat4 uProj;
uniform float uTime;

out vec3 grassColor;
out float hOut;
out float vDist;

void main(){
 float h=clamp(aBlade.y/1.0,0.,1.);

 float co=cos(iVar.x);
 float si=sin(iVar.x);

 float lx=aBlade.x*co-aBlade.z*si;
 float lz=aBlade.x*si+aBlade.z*co;

 float px=iTransform.x;
 float py=iTransform.y;
 float pz=iTransform.z;
 float scale=iTransform.w;

 float w1=sin(uTime*.72+px*.055+pz*.024);
 float w2=sin(uTime*1.15-px*.019+pz*.068);
 float gust=.72+.28*sin(uTime*.19+px*.009-pz*.006);

 float bendX=(w1*.105+w2*.032)*gust*h*h;
 float bendZ=(w1*.052-w2*.022)*gust*h*h;

 vec3 p;

 p.x=px+lx*scale+bendX;
 p.y=py+aBlade.y*scale;
 p.z=pz+lz*scale+bendZ;

 vec4 viewPos=uView*vec4(p,1.);
 vDist=length(viewPos.xyz);

 gl_Position=uProj*viewPos;

 vec3 base=vec3(.16,.29,.065);
 vec3 tip=vec3(.43,.59,.17);

 grassColor=mix(base,tip,h)*vec3(iVar.y,1.,iVar.z);
 hOut=h;
}`,
`#version 300 es
precision mediump float;

in vec3 grassColor;
in float hOut;
in float vDist;

uniform vec3 uFogColor;
uniform vec3 uAmbientColor;
uniform vec3 uSunColor;
uniform vec3 uSunDir;

out vec4 outColor;

void main(){
 vec3 base=grassColor*(.85+.15*hOut);

 float lightIntensity=
  .5+
  .5*max(0.0,uSunDir.y);

 vec3 c=
  base*
  (uAmbientColor+uSunColor*lightIntensity);

 float fog=smoothstep(35.0,110.0,vDist);

 c=mix(c,uFogColor,fog);

 outColor=vec4(c,1.);
}`
);

const treeProgram=makeProgram(
`#version 300 es
precision highp float;

layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNormal;
layout(location=2) in vec3 aColor;

layout(location=3) in vec4 iData;
layout(location=4) in vec4 iParams;

uniform mat4 uView;
uniform mat4 uProj;
uniform float uTime;

out vec3 vColor;
out vec3 vNormal;
out float vDist;

void main(){
 float birth=iParams.x;
 float dur=max(iParams.y,.001);
 float rot=iParams.z;

 float age=max(0.0,uTime-birth);
 float growthProgress=clamp(age/dur,0.0,1.0);
 float growth=smoothstep(0.0,1.0,growthProgress);

 float maxS=iData.w;

 float currentScale=
  maxS*
  mix(0.12,1.0,growth);

 float co=cos(rot);
 float si=sin(rot);

 vec3 p=aPos;

 if(p.y>0.8){
  float h=p.y/5.0;

  float w1=
   sin(uTime*.85+iData.x*.05+iData.z*.03);

  float w2=
   cos(uTime*1.25-iData.x*.02+iData.z*.06);

  p.x+=w1*.12*h;
  p.z+=w2*.12*h;
 }

 p*=currentScale;

 float rx=p.x*co-p.z*si;
 float rz=p.x*si+p.z*co;

 p.x=rx;
 p.z=rz;

 p.x+=iData.x;
 p.y+=iData.y;
 p.z+=iData.z;

 vec3 n=aNormal;

 float nx=n.x*co-n.z*si;
 float nz=n.x*si+n.z*co;

 vNormal=vec3(nx,n.y,nz);

 vec4 viewPos=uView*vec4(p,1.);
 vDist=length(viewPos.xyz);

 gl_Position=uProj*viewPos;

 vec3 saplingTint=
  mix(
   vec3(1.25,1.35,.85),
   vec3(1.0),
   smoothstep(0.0,.4,growthProgress)
  );

 vColor=aColor*saplingTint;
}`,
`#version 300 es
precision mediump float;

in vec3 vColor;
in vec3 vNormal;
in float vDist;

uniform vec3 uFogColor;
uniform vec3 uAmbientColor;
uniform vec3 uSunColor;
uniform vec3 uSunDir;

out vec4 outColor;

void main(){
 vec3 norm=normalize(vNormal);

 float diff=max(dot(norm,uSunDir),0.0);
 float lightIntensity=.35+.65*diff;

 vec3 c=
  vColor*
  (uAmbientColor+uSunColor*lightIntensity);

 float fog=smoothstep(35.0,110.0,vDist);

 c=mix(c,uFogColor,fog);

 outColor=vec4(c,1.0);
}`
);

function buildPineGeometry(){
 const positions=[],normals=[],colors=[];

 function addTri(p1,p2,p3,norm,col){
  positions.push(...p1,...p2,...p3);
  normals.push(...norm,...norm,...norm);
  colors.push(...col,...col,...col);
 }

 function addQuad(p1,p2,p3,p4,col){
  const ux=p2[0]-p1[0];
  const uy=p2[1]-p1[1];
  const uz=p2[2]-p1[2];

  const vx=p3[0]-p1[0];
  const vy=p3[1]-p1[1];
  const vz=p3[2]-p1[2];

  let nx=uy*vz-uz*vy;
  let ny=uz*vx-ux*vz;
  let nz=ux*vy-uy*vx;

  const len=Math.hypot(nx,ny,nz)||1;
  const norm=[nx/len,ny/len,nz/len];

  addTri(p1,p2,p3,norm,col);
  addTri(p1,p3,p4,norm,col);
 }

 function addCone(
  baseY,
  topY,
  radiusBase,
  radiusTop,
  sides,
  col
 ){
  for(let i=0;i<sides;i++){
   const a1=(i/sides)*Math.PI*2;
   const a2=((i+1)/sides)*Math.PI*2;

   const x1b=Math.cos(a1)*radiusBase;
   const z1b=Math.sin(a1)*radiusBase;

   const x2b=Math.cos(a2)*radiusBase;
   const z2b=Math.sin(a2)*radiusBase;

   const x1t=Math.cos(a1)*radiusTop;
   const z1t=Math.sin(a1)*radiusTop;

   const x2t=Math.cos(a2)*radiusTop;
   const z2t=Math.sin(a2)*radiusTop;

   const p1=[x1b,baseY,z1b];
   const p2=[x2b,baseY,z2b];
   const p3=[x2t,topY,z2t];
   const p4=[x1t,topY,z1t];

   if(radiusTop===0){
    const ux=p2[0]-p1[0];
    const uy=p2[1]-p1[1];
    const uz=p2[2]-p1[2];

    const vx=p3[0]-p1[0];
    const vy=p3[1]-p1[1];
    const vz=p3[2]-p1[2];

    let nx=uy*vz-uz*vy;
    let ny=uz*vx-ux*vz;
    let nz=ux*vy-uy*vx;

    const len=Math.hypot(nx,ny,nz)||1;

    addTri(
     p1,p2,p3,
     [nx/len,ny/len,nz/len],
     col
    );
   }else{
    addQuad(p1,p2,p3,p4,col);
   }
  }
 }

 addCone(0.0,1.8,.28,.18,6,[.26,.16,.09]);

 addCone(1.1,3.6,1.55,0.0,7,[.12,.30,.09]);
 addCone(2.2,4.7,1.25,0.0,7,[.16,.38,.12]);
 addCone(3.4,5.8,.85,0.0,6,[.22,.46,.16]);

 return {
  positions:new Float32Array(positions),
  normals:new Float32Array(normals),
  colors:new Float32Array(colors),
  vertexCount:positions.length/3
 };
}

function buildOakGeometry(){
 const positions=[],normals=[],colors=[];

 function addTri(p1,p2,p3,norm,col){
  positions.push(...p1,...p2,...p3);
  normals.push(...norm,...norm,...norm);
  colors.push(...col,...col,...col);
 }

 function addQuad(p1,p2,p3,p4,col){
  const ux=p2[0]-p1[0];
  const uy=p2[1]-p1[1];
  const uz=p2[2]-p1[2];

  const vx=p3[0]-p1[0];
  const vy=p3[1]-p1[1];
  const vz=p3[2]-p1[2];

  let nx=uy*vz-uz*vy;
  let ny=uz*vx-ux*vz;
  let nz=ux*vy-uy*vx;

  const len=Math.hypot(nx,ny,nz)||1;
  const norm=[nx/len,ny/len,nz/len];

  addTri(p1,p2,p3,norm,col);
  addTri(p1,p3,p4,norm,col);
 }

 function addCylinder(
  baseY,
  topY,
  rBase,
  rTop,
  sides,
  col
 ){
  for(let i=0;i<sides;i++){
   const a1=(i/sides)*Math.PI*2;
   const a2=((i+1)/sides)*Math.PI*2;

   const p1=[
    Math.cos(a1)*rBase,
    baseY,
    Math.sin(a1)*rBase
   ];

   const p2=[
    Math.cos(a2)*rBase,
    baseY,
    Math.sin(a2)*rBase
   ];

   const p3=[
    Math.cos(a2)*rTop,
    topY,
    Math.sin(a2)*rTop
   ];

   const p4=[
    Math.cos(a1)*rTop,
    topY,
    Math.sin(a1)*rTop
   ];

   addQuad(p1,p2,p3,p4,col);
  }
 }

 function addFoliageClump(cx,cy,cz,radius,col){
  const rings=4;
  const segs=6;

  for(let r=0;r<rings;r++){
   const phi1=(r/rings)*Math.PI;
   const phi2=((r+1)/rings)*Math.PI;

   for(let s=0;s<segs;s++){
    const theta1=(s/segs)*Math.PI*2;
    const theta2=((s+1)/segs)*Math.PI*2;

    const p1=[
     cx+Math.sin(phi1)*Math.cos(theta1)*radius,
     cy+Math.cos(phi1)*radius,
     cz+Math.sin(phi1)*Math.sin(theta1)*radius
    ];

    const p2=[
     cx+Math.sin(phi1)*Math.cos(theta2)*radius,
     cy+Math.cos(phi1)*radius,
     cz+Math.sin(phi1)*Math.sin(theta2)*radius
    ];

    const p3=[
     cx+Math.sin(phi2)*Math.cos(theta2)*radius,
     cy+Math.cos(phi2)*radius,
     cz+Math.sin(phi2)*Math.sin(theta2)*radius
    ];

    const p4=[
     cx+Math.sin(phi2)*Math.cos(theta1)*radius,
     cy+Math.cos(phi2)*radius,
     cz+Math.sin(phi2)*Math.sin(theta1)*radius
    ];

    const ux=p2[0]-p1[0];
    const uy=p2[1]-p1[1];
    const uz=p2[2]-p1[2];

    const vx=p3[0]-p1[0];
    const vy=p3[1]-p1[1];
    const vz=p3[2]-p1[2];

    let nx=uy*vz-uz*vy;
    let ny=uz*vx-ux*vz;
    let nz=ux*vy-uy*vx;

    const len=Math.hypot(nx,ny,nz)||1;
    const norm=[nx/len,ny/len,nz/len];

    addTri(p1,p2,p3,norm,col);
    addTri(p1,p3,p4,norm,col);
   }
  }
 }

 addCylinder(
  0.0,
  2.5,
  .38,
  .24,
  7,
  [.32,.20,.11]
 );

 addFoliageClump(
  0.0,3.8,0.0,1.75,
  [.22,.45,.12]
 );

 addFoliageClump(
  .85,3.1,.5,1.30,
  [.26,.52,.15]
 );

 addFoliageClump(
  -.8,3.2,-.6,1.25,
  [.18,.40,.10]
 );

 addFoliageClump(
  .2,2.8,-.85,1.20,
  [.24,.48,.14]
 );

 addFoliageClump(
  -.4,2.9,.8,1.15,
  [.20,.42,.11]
 );

 return {
  positions:new Float32Array(positions),
  normals:new Float32Array(normals),
  colors:new Float32Array(colors),

 }else{

   hash2(cx*13,cz*29,402)<.08
    ? 1
    : 0;
 }

 for(let i=0;i<candidateCount;i++){
  const rx=
   hash2(
    cx*131+i*7,
    cz*47+i*11,
    301
   );

  const rz=
   hash2(

  const localVal=

  if(forestChunk){
   if(localVal<.38)continue;

   if(localVal<.86)continue;

  let tooClose=false;

  for(let p=0;p<treeCollisionData.length;p+=7){
   const ox=treeCollisionData[p+0];
   const oz=treeCollisionData[p+1];

   const dx=wx-ox;
   const dz=wz-oz;

   if(dx*dx+dz*dz<4.8*4.8){
    tooClose=true;
    break;
   }
  }

  if(tooClose)continue;

  const maxScale=
   .82+
   hash2(
    cx*19+i,
    cz*23+i,
    303
   )*.52;

  const birthTime=
   hash2(
    cx*37+i,

  const growthDuration=

   )*

  const rotAngle=

    308
   )*
   Math.PI*2;

  const seed=
   hash2(
    cx*71+i,
    cz*73+i,
    309
   );

  const treeType=
   hash2(
    cx*89+i,
    cz*97+i,
    310
   );

  if(treeType>.45){
   oakData.push(
    wx,
    wy,
    wz,
    maxScale
   );

   oakParams.push(
    birthTime,
    growthDuration,
    rotAngle,
    seed
   );

   treeCollisionData.push(
    wx,

    .42,

   );
  }else{
   pineData.push(

   );

   );
  }

 }

function updateChunks(){

 const pcz=Math.floor(playerZ/CHUNK);

 const wanted=[];

 for(
  let dz=-LOAD_RADIUS;
  dz<=LOAD_RADIUS;
  dz++
 ){
  for(
   let dx=-LOAD_RADIUS;
   dx<=LOAD_RADIUS;
   dx++
  ){
   wanted.push({
    cx:pcx+dx,
    cz:pcz+dz,
    d:dx*dx+dz*dz
   });
  }
 }

 wanted.sort(
  (a,b)=>a.d-b.d
 );

 let made=0;

 for(let i=0;i<wanted.length;i++){
  const w=wanted[i];

  if(
   !active.has(
    chunkKey(w.cx,w.cz)
   )
  ){
   createChunk(
    w.cx,
    w.cz
   );

   made++;

   if(made>=2)break;
  }
 }

 for(const [key,ch] of active){
  if(
   Math.abs(ch.cx-pcx)>LOAD_RADIUS||
   Math.abs(ch.cz-pcz)>LOAD_RADIUS
  ){
   active.delete(key);
   deleteChunk(ch);
  }
 }
}

function resolveTreeCollision(){
 const playerRadius=.30;

 const searchRadius=5.0;

 for(const ch of active.values()){
  const trees=ch.treeCollisionData;

  if(!trees||!trees.length)continue;

  for(let i=0;i<trees.length;i+=7){
   const tx=trees[i+0];
   const tz=trees[i+1];

   let dx=playerX-tx;
   let dz=playerZ-tz;

   if(
    Math.abs(dx)>searchRadius||
    Math.abs(dz)>searchRadius
   ){
    continue;
   }

   const baseRadius=trees[i+2];
   const maxScale=trees[i+3];
   const birth=trees[i+4];
   const duration=Math.max(
    trees[i+5],
    .001
   );

   const age=
    Math.max(
     0.0,
     elapsed-birth
    );

   const growthProgress=
    Math.min(
     1.0,
     age/duration
    );

   const growth=(
    growthProgress*
    growthProgress*
    (3.0-2.0*growthProgress)
   );

   const currentScale=
    maxScale*
    (
     .12+
     .88*growth
    );

   const treeRadius=
    baseRadius*
    currentScale;

   const minDistance=
    playerRadius+
    treeRadius;

   const d2=dx*dx+dz*dz;

   if(d2>=minDistance*minDistance){
    continue;
   }

   let dist=Math.sqrt(d2);

   
   if(dist<0.0001){
    dx=.001;
    dz=0;
    dist=.001;
   }

   const push=
    (minDistance-dist)/dist;

   playerX+=dx*push;
   playerZ+=dz*push;
  }
 }

 const floor=
  terrainHeight(
   playerX,
   playerZ
  )+
  1.72;

 if(playerY<floor){
  playerY=floor;

  if(velocityY<0){
   velocityY=0;
  }

  grounded=true;
 }
}

function updatePlayer(dt){
 let f=0;
 let s=0;

 if(keys.w||keys.arrowup)f++;
 if(keys.s||keys.arrowdown)f--;
 if(keys.a||keys.arrowleft)s++;
 if(keys.d||keys.arrowright)s--;

 const len=Math.hypot(f,s);

 if(len){
  f/=len;
  s/=len;

  const speed=
   keys.shift
    ? 8.6
    : 4.8;

  const sy=Math.sin(yaw);
  const cy=Math.cos(yaw);

  playerX+=
   (
    s*cy+
    f*sy
   )*
   speed*
   dt;

  playerZ+=
   (
    -s*sy+
    f*cy
   )*
   speed*
   dt;

  resolveTreeCollision();
 }

 const floor=
  terrainHeight(
   playerX,
   playerZ
  )+
  1.72;

 velocityY-=19*dt;

 playerY+=velocityY*dt;

 if(playerY<=floor){
  playerY=floor;
  velocityY=0;
  grounded=true;
 }else{
  grounded=false;
 }

 resolveTreeCollision();
}

function perspective(
 fov,
 aspect,
 near,
 far
){
 const f=1/Math.tan(fov*.5);
 const nf=1/(near-far);

 return new Float32Array([
  f/aspect,0,0,0,
  0,f,0,0,
  0,0,(far+near)*nf,-1,
  0,0,(2*far*near)*nf,0
 ]);
}

function norm(x,y,z){
 const d=Math.hypot(x,y,z)||1;

 return [
  x/d,
  y/d,
  z/d
 ];
}

function cross(a,b){
 return [
  a[1]*b[2]-a[2]*b[1],
  a[2]*b[0]-a[0]*b[2],
  a[0]*b[1]-a[1]*b[0]
 ];
}

function viewMatrix(
 ex,ey,ez,
 cx,cy,cz
){
 const z=norm(
  ex-cx,
  ey-cy,
  ez-cz
 );

 let x=
  cross(
   [0,1,0],
   z
  );

 const d=
  Math.hypot(
   x[0],
   x[1],
   x[2]
  );

 if(d<1e-6){
  x=[1,0,0];
 }else{
  x=[
   x[0]/d,
   x[1]/d,
   x[2]/d
  ];
 }

 const y=cross(z,x);

 return new Float32Array([
  x[0],y[0],z[0],0,
  x[1],y[1],z[1],0,
  x[2],y[2],z[2],0,

  -(x[0]*ex+x[1]*ey+x[2]*ez),
  -(y[0]*ex+y[1]*ey+y[2]*ez),
  -(z[0]*ex+z[1]*ey+z[2]*ez),

  1
 ]);
}

function scheduleDrone(){
 if(!isPlaying)return;

 const osc=
  audioCtx.createOscillator();

 const filter=
  audioCtx.createBiquadFilter();

 const gain=
  audioCtx.createGain();

 const baseFreq=
  scaleFrequencies[
   Math.floor(
    Math.random()*5
   )
  ];

 osc.type=
  Math.random()>.5
   ? "sine"
   : "triangle";

 osc.frequency.setValueAtTime(
  baseFreq,
  audioCtx.currentTime
 );

 const lfo=
  audioCtx.createOscillator();

 const lfoGain=
  audioCtx.createGain();

 lfo.frequency.setValueAtTime(
  .2+
  Math.random()*.3,
  audioCtx.currentTime
 );

 lfoGain.gain.setValueAtTime(
  1.5,
  audioCtx.currentTime
 );

 lfo.connect(lfoGain);
 lfoGain.connect(osc.frequency);
 lfo.start();

 filter.type="lowpass";

 filter.frequency.setValueAtTime(
  300+Math.random()*250,
  audioCtx.currentTime
 );

 const duration=
  12+
  Math.random()*10;

 gain.gain.setValueAtTime(
  .001,
  audioCtx.currentTime
 );

 gain.gain.linearRampToValueAtTime(
  .12,
  audioCtx.currentTime+4
 );

 gain.gain.linearRampToValueAtTime(
  .001,
  audioCtx.currentTime+duration
 );

 osc.connect(filter);
 filter.connect(gain);
 gain.connect(masterGain);

 osc.start();

 osc.stop(
  audioCtx.currentTime+duration
 );

 lfo.stop(
  audioCtx.currentTime+duration
 );

 let t=setTimeout(
  scheduleDrone,
  (duration-3)*1000
 );

 timers.push(t);
}

 gain.gain.exponentialRampToValueAtTime(
  .0001,
  audioCtx.currentTime+duration
 );

 const delay=
  audioCtx.createDelay();

 delay.delayTime.setValueAtTime(
  .35,
  audioCtx.currentTime
 );

 const feedback=
  audioCtx.createGain();

 feedback.gain.setValueAtTime(
  .4,
  audioCtx.currentTime
 );

 osc.connect(filter);
 filter.connect(gain);
 gain.connect(masterGain);

 gain.connect(delay);
 delay.connect(feedback);
 feedback.connect(delay);
 delay.connect(masterGain);

 osc.start();

 osc.stop(
  audioCtx.currentTime+duration
 );

 let nextTime=
  1500+
  Math.random()*3500;

 let t=setTimeout(
  scheduleMelody,
  nextTime
 );

 timers.push(t);
}

function scheduleChords(){
 if(!isPlaying)return;

 const chordNotes=[
  scaleFrequencies[
   Math.floor(Math.random()*8)
  ],

  scaleFrequencies[
   Math.floor(Math.random()*8)+2
  ],

  scaleFrequencies[
   Math.floor(Math.random()*8)+4
  ]
 ];

 chordNotes.forEach(
  freq=>{
   const osc=
    audioCtx.createOscillator();

   const gain=
    audioCtx.createGain();

   const filter=
    audioCtx.createBiquadFilter();

   osc.type="triangle";

   osc.frequency.setValueAtTime(
    freq,
    audioCtx.currentTime
   );

   filter.type="lowpass";

   filter.frequency.setValueAtTime(
    600,
    audioCtx.currentTime
   );

   const duration=
    6+
    Math.random()*6;

   gain.gain.setValueAtTime(
    .001,
    audioCtx.currentTime
   );

   gain.gain.linearRampToValueAtTime(
    .04,
    audioCtx.currentTime+2
   );

   gain.gain.linearRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
   );

   osc.connect(filter);
   filter.connect(gain);
   gain.connect(masterGain);

   osc.start();

   osc.stop(
    audioCtx.currentTime+duration
   );
  }
 );

 let t=setTimeout(
  scheduleChords,
  7000+
  Math.random()*6000
 );

 timers.push(t);
}

function ensureRainAudio(){
 if(
  !audioCtx||
  !masterGain||
  rainGainNode
 ){
  return;
 }

 const bufferSize=
  audioCtx.sampleRate*2;

 const buf=
  audioCtx.createBuffer(
   1,
   bufferSize,
   audioCtx.sampleRate
  );

 const data=
  buf.getChannelData(0);

 for(
  let i=0;
  i<bufferSize;
  i++
 ){
  data[i]=
   Math.random()*2-1;
 }

 const src=
  audioCtx.createBufferSource();

 src.buffer=buf;
 src.loop=true;

 const filter=
  audioCtx.createBiquadFilter();

 filter.type="bandpass";

 filter.frequency.setValueAtTime(
  3200,
  audioCtx.currentTime
 );

 filter.Q.setValueAtTime(
  .6,
  audioCtx.currentTime
 );

 const gain=
  audioCtx.createGain();

 gain.gain.setValueAtTime(
  .0001,
  audioCtx.currentTime
 );

 src.connect(filter);
 filter.connect(gain);
 gain.connect(masterGain);

 src.start();

 rainGainNode=gain;
}

function setRainAudioTarget(active){
 if(!audioCtx)return;

 ensureRainAudio();

 if(!rainGainNode)return;

 const now=
  audioCtx.currentTime;

 rainGainNode.gain.cancelScheduledValues(
  now
 );

 rainGainNode.gain.setValueAtTime(
  Math.max(
   .0001,
   rainGainNode.gain.value
  ),
  now
 );

 rainGainNode.gain.exponentialRampToValueAtTime(
  active
   ? .22
   : .0001,
  now+3
 );
}

function scheduleThunder(){
 if(thunderTimer){
  clearTimeout(thunderTimer);
  thunderTimer=null;
 }

 if(rainTarget<.5)return;

 const delay=
  6000+
  Math.random()*14000;

 thunderTimer=
  setTimeout(
   ()=>{
    playThunder();
    scheduleThunder();
   },
   delay
  );
}

function playThunder(){
 if(
  !audioCtx||
  !masterGain
 )return;

 const now=
  audioCtx.currentTime;

 const fade=
  document.getElementById("fade");

 fade.style.transition=
  "background-color 0.08s ease-out";

 fade.style.backgroundColor=
  "rgba(255,255,255,.32)";

 setTimeout(
  ()=>{
   fade.style.backgroundColor=
    "transparent";
  },
  90+Math.random()*70
 );

 const bufferSize=
  Math.floor(
   audioCtx.sampleRate*1.6
  );

 const buf=
  audioCtx.createBuffer(
   1,
   bufferSize,
   audioCtx.sampleRate
  );

 const data=
  buf.getChannelData(0);

 for(
  let i=0;
  i<bufferSize;
  i++
 ){
  data[i]=
   (Math.random()*2-1)*
   Math.exp(
    -i/
    (bufferSize*.28)
   );
 }

 const src=
  audioCtx.createBufferSource();

 src.buffer=buf;

 const filter=
  audioCtx.createBiquadFilter();

 filter.type="lowpass";

 filter.frequency.setValueAtTime(
  170+
  Math.random()*130,
  now
 );

 const gain=
  audioCtx.createGain();

 gain.gain.setValueAtTime(
  .0001,
  now
 );

 gain.gain.exponentialRampToValueAtTime(
  .5,
  now+.05
 );

 gain.gain.exponentialRampToValueAtTime(
  .0001,
  now+2.2
 );

 src.connect(filter);
 filter.connect(gain);
 gain.connect(masterGain);

 src.start();
}

window.nostalgicRain=
 function(state){
  if(typeof state==="undefined"){
   state=
    rainTarget<.5;
  }

  rainTarget=
   state
    ? 1
    : 0;

  if(state){
   if(!isPlaying){
    startEnvironmentAudio();
   }

   setRainAudioTarget(true);

   scheduleThunder();

   hud.textContent=
    "NOSTALGIC RAIN — THE SKY REMEMBERS...";
  }else{
   setRainAudioTarget(false);

   scheduleThunder();

   hud.textContent=
    "GOLDEN NOSTALGIC PLAIN — ENVIRONMENT AWAKENED";
  }

  return(
   "Nostalgic Rain: "+
   (state?"ON":"OFF")
  );
 };

function lerp(a,b,f){
 return a+(b-a)*f;
}

function lerpVec3(a,b,f){
 return [
  lerp(a[0],b[0],f),
  lerp(a[1],b[1],f),
  lerp(a[2],b[2],f)
 ];
}

function getEnvironmentState(cycleTime){
 let idx=0;

 for(
  let i=0;
  i<keyframes.length-1;
  i++
 ){
  if(
   cycleTime>=keyframes[i].t&&
   cycleTime<keyframes[i+1].t
  ){
   idx=i;
   break;
  }
 }

 const k1=keyframes[idx];
 const k2=keyframes[idx+1];

 const factor=
  (cycleTime-k1.t)/
  (k2.t-k1.t);

 const smoothF=
  factor*
  factor*
  (3.0-2.0*factor);

 const sunAngle=
  (cycleTime-.52)*
  Math.PI*2.0;

 const sunY=
  Math.sin(sunAngle);

 const sunX=
  Math.cos(sunAngle);

 const sunZ=.35;

 const len=
  Math.hypot(
   sunX,
   sunY,
   sunZ
  );

 const sunDir=[
  sunX/len,
  sunY/len,
  sunZ/len
 ];

 const moonDir=[
  -sunDir[0],
  -sunDir[1],
  -sunDir[2]
 ];

 return {
  skyTop:
   lerpVec3(
    k1.skyTop,
    k2.skyTop,
    smoothF
   ),

  skyHorizon:
   lerpVec3(
    k1.skyHorizon,
    k2.skyHorizon,
    smoothF
   ),

  sunColor:
   lerpVec3(
    k1.sunColor,
    k2.sunColor,
    smoothF
   ),

  moonColor:
   lerpVec3(
    k1.moonColor,
    k2.moonColor,
    smoothF
   ),

  cloudColor:
   lerpVec3(
    k1.cloudColor,
    k2.cloudColor,
    smoothF
   ),

  fogColor:
   lerpVec3(
    k1.fogColor,
    k2.fogColor,
    smoothF
   ),

  ambient:
   lerpVec3(
    k1.ambient,
    k2.ambient,
    smoothF
   ),

  nightFactor:
   lerp(
    k1.night,
    k2.night,
    smoothF
   ),

  sunDir,
  moonDir
 };
}

function getTimePhaseName(cycleTime){
 if(
  cycleTime>=.92||
  cycleTime<.08
 ){
  return "SUNSET";
 }

 if(
  cycleTime>=.08&&
  cycleTime<.20
 ){
  return "NIGHT";
 }

 if(
  cycleTime>=.20&&
  cycleTime<.35
 ){
  return "MIDNIGHT";
 }

 if(
  cycleTime>=.35&&
  cycleTime<.48
 ){
  return "DAWN / SUNRISE";
 }

 if(
  cycleTime>=.48&&
  cycleTime<.65
 ){
  return "MORNING";
 }

 if(
  cycleTime>=.65&&
  cycleTime<.82
 ){
  return "NOON";
 }

 return "AFTERNOON";
}

 );

 );

 gl.uniform3fv(

 );

 gl.uniform3fv(

 );

 );

 gl.drawArrays(

 gl.enable(gl.DEPTH_TEST);


 for(const ch of active.values()){

 frames++;
}
